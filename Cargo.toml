[workspace]
resolver = "2"
members = ["crates/pycelium-core", "crates/pycelium-lab"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/initialvisuals/pycelium"
authors = ["Initial Visuals"]

[workspace.dependencies]
pycelium-core = { path = "crates/pycelium-core" }
rand = { version = "0.8", features = ["std", "std_rng"] }
