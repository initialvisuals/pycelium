[package]
name = "pycelium-win"
version = "0.2.0"
edition = "2021"
description = "High-performance Windows mycelium simulator (GPU compute + large host soil)"
license = "BSD-3-Clause"

[[bin]]
name = "pycelium-win"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
pollster = "0.4"
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
winit = "0.30"

[dev-dependencies]
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
