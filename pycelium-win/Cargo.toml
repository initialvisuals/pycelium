[package]
name = "pycelium-win"
version = "0.2.0"
edition = "2021"
description = "High-performance Windows mycelium simulator (GPU compute + large host soil)"
license = "BSD-3-Clause"

[[bin]]
name = "pycelium-win"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
pollster = "0.4"
rand = "0.8"
rayon = "1.10"
wgpu = "30"
winit = "0.30"
